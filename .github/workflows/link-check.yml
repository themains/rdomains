name: link-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # External links rot without a commit to trigger a rerun, so a dormant repo
  # would otherwise never find out.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The reusable workflow restricts itself to this as well, but a called workflow
# can only ever narrow what the caller holds -- so the caller is where the
# ceiling is actually set.
permissions:
  contents: read

jobs:
  links:
    uses: gojiplus/r-canon/.github/workflows/reusable-link-check.yml@v2
    with:
      # API base URLs that answer 404 or 401 without a real request, two
      # publishers that answer 403 to anything that looks automated, and
      # curlie.org, which answers 502/503 intermittently (twice in one day
      # of CI runs). All are reachable in a browser; none can be checked
      # from CI.
      exclude: |
        ^https://api\.openai\.com/v1(/|$)
        ^https://api\.anthropic\.com/v1(/|$)
        ^https://www\.science\.org/
        ^http://www\.washingtontimes\.com/
        ^https://curlie\.org/
        ^https://web\.archive\.org/cdx/search/cdx$
